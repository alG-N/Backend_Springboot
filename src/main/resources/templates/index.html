<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Trang chủ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }

        .navbar {
            background: #333;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a { color: white; text-decoration: none; margin: 0 1rem; }
        .navbar a:hover { color: #ddd; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); }

        .product-image {
            width: 100%;
            height: 200px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .product-info { padding: 1rem; }
        .product-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.5rem; }
        .product-price { color: #e53935; font-size: 1.2rem; font-weight: bold; margin: 0.5rem 0; }

        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #1976d2; }
        .btn-success { background: #4caf50; }
        .btn-success:hover { background: #388e3c; }
    </style>
</head>
<body>
<!-- Navbar -->
<div class="navbar">
    <div>
        <a href="/" style="font-size: 1.5rem; font-weight: bold;">SHOP</a>
        <a href="/products">Sản phẩm</a>
    </div>
    <div>
            <span sec:authorize="isAuthenticated()">
                Xin chào, <span sec:authentication="name"></span>
                <a href="/orders">Đơn hàng</a>
                <span sec:authorize="hasRole('ADMIN')">
                    <a href="/admin">Quản trị</a>
                </span>
                <a href="/logout">Đăng xuất</a>
            </span>
        <span sec:authorize="!isAuthenticated()">
                <a href="/login">Đăng nhập</a>
                <a href="/register">Đăng ký</a>
            </span>
        <a href="/cart" class="btn btn-success">Giỏ hàng</a>
    </div>
</div>

<!-- Content -->
<div class="container">
    <h1>Sản phẩm nổi bật</h1>

    <div class="product-grid">
        <div th:each="product : ${products}" class="product-card">
            <div class="product-image">
                <span th:text="${product.image != null ? '' : 'No Image'}"></span>
            </div>
            <div class="product-info">
                <div class="product-name" th:text="${product.name}">Tên sản phẩm</div>
                <div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0đ</div>
                <a th:href="@{/products/{id}(id=${product.id})}" class="btn">Xem chi tiết</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
