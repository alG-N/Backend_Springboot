<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }

        .navbar {
            background: #333;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a { color: white; text-decoration: none; margin: 0 1rem; }
        .navbar a:hover { color: #ddd; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        .cart-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto auto auto;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #999;
        }

        .item-info h3 {
            margin-bottom: 0.5rem;
            color: #333;
        }

        .item-price {
            color: #e53935;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .quantity-control button:hover {
            background: #f5f5f5;
        }

        .quantity-control input {
            width: 60px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 0.25rem;
            border-radius: 4px;
        }

        .btn-remove {
            background: #f44336;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-remove:hover { background: #d32f2f; }

        .cart-summary {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
            text-align: right;
        }

        .total-price {
            font-size: 2rem;
            color: #e53935;
            font-weight: bold;
            margin: 1rem 0;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
        }
        .btn:hover { background: #388e3c; }
        .btn-back { background: #2196f3; }
        .btn-back:hover { background: #1976d2; }
        .btn-clear { background: #ff9800; }
        .btn-clear:hover { background: #f57c00; }
    </style>
</head>
<body>
<div class="navbar">
    <div>
        <a href="/" style="font-size: 1.5rem; font-weight: bold;">SHOP</a>
        <a href="/products">Sản phẩm</a>
    </div>
    <div>
        <span sec:authorize="isAuthenticated()">
            Xin chào, <span sec:authentication="name"></span>
            <a href="/orders">Đơn hàng</a>
            <a href="/logout">Đăng xuất</a>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a href="/login">Đăng nhập</a>
        </span>
    </div>
</div>

<div class="container">
    <div class="cart-container">
        <h1 style="margin-bottom: 2rem;">Giỏ hàng của bạn</h1>

        <div id="cartEmpty" class="cart-empty" style="display: none;">
            <h2>Giỏ hàng trống</h2>
            <p style="margin: 1rem 0;">Hãy thêm sản phẩm vào giỏ hàng!</p>
            <a href="/products" class="btn">Mua sắm ngay</a>
        </div>

        <div id="cartItems"></div>

        <div id="cartSummary" class="cart-summary" style="display: none;">
            <div>
                <button onclick="clearCart()" class="btn btn-clear">Xóa giỏ hàng</button>
                <a href="/products" class="btn btn-back">Tiếp tục mua</a>
            </div>
            <div class="total-price">
                Tổng cộng: <span id="totalPrice">0đ</span>
            </div>
            <button onclick="checkout()" class="btn">Đặt hàng</button>
        </div>
    </div>
</div>

<script>
    function loadCart() {
        fetch('/api/cart')
            .then(response => response.json())
            .then(data => {
                const items = data.items || [];
                const total = data.total || 0;

                if (items.length === 0) {
                    document.getElementById('cartEmpty').style.display = 'block';
                    document.getElementById('cartSummary').style.display = 'none';
                } else {
                    document.getElementById('cartEmpty').style.display = 'none';
                    document.getElementById('cartSummary').style.display = 'block';
                    renderCartItems(items);
                    document.getElementById('totalPrice').textContent = formatPrice(total) + 'đ';
                }
            })
            .catch(error => console.error('Error:', error));
    }

    function renderCartItems(items) {
        const container = document.getElementById('cartItems');
        container.innerHTML = items.map(item => `
            <div class="cart-item">
                <div class="item-image">No Image</div>
                <div class="item-info">
                    <h3>${item.productName}</h3>
                    <div class="item-price">${formatPrice(item.price)}đ</div>
                </div>
                <div class="quantity-control">
                    <button onclick="updateQuantity(${item.productId}, ${item.quantity - 1})">-</button>
                    <input type="number" value="${item.quantity}" min="1"
                           onchange="updateQuantity(${item.productId}, this.value)" readonly>
                    <button onclick="updateQuantity(${item.productId}, ${item.quantity + 1})">+</button>
                </div>
                <div class="item-price">${formatPrice(item.price * item.quantity)}đ</div>
                <button class="btn-remove" onclick="removeItem(${item.productId})">Xóa</button>
            </div>
        `).join('');
    }

    function updateQuantity(productId, quantity) {
        if (quantity < 1) return;

        fetch(`/api/cart/update/${productId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quantity: parseInt(quantity) })
        })
            .then(() => loadCart())
            .catch(error => console.error('Error:', error));
    }

    function removeItem(productId) {
        if (confirm('Xóa sản phẩm này khỏi giỏ hàng?')) {
            fetch(`/api/cart/remove/${productId}`, { method: 'DELETE' })
                .then(() => loadCart())
                .catch(error => console.error('Error:', error));
        }
    }

    function clearCart() {
        if (confirm('Xóa toàn bộ giỏ hàng?')) {
            fetch('/api/cart/clear', { method: 'DELETE' })
                .then(() => loadCart())
                .catch(error => console.error('Error:', error));
        }
    }

    function checkout() {
        const address = prompt('Nhập địa chỉ giao hàng:');
        if (!address || address.trim() === '') {
            alert('Vui lòng nhập địa chỉ giao hàng!');
            return;
        }

        fetch('/api/cart')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Không thể lấy thông tin giỏ hàng');
                }
                return response.json();
            })
            .then(data => {
                if (!data.items || data.items.length === 0) {
                    throw new Error('Giỏ hàng trống!');
                }

                const orderData = {
                    shippingAddress: address,
                    items: data.items.map(item => ({
                        productId: item.productId,
                        quantity: item.quantity
                    }))
                };

                console.log('Sending order data:', orderData);

                return fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Không thể tạo đơn hàng. Status: ' + response.status);
                }
                return response.json();
            })
            .then(order => {
                console.log('Order created:', order);

                if (order && order.id) {
                    alert('Đặt hàng thành công! Mã đơn hàng: #' + order.id);

                    return fetch('/api/cart/clear', { method: 'DELETE' })
                        .then(() => {
                            window.location.href = '/orders';
                        });
                } else {
                    throw new Error('Không nhận được mã đơn hàng');
                }
            })
            .catch(error => {
                console.error('Checkout error:', error);
                alert('Có lỗi xảy ra: ' + error.message + '\nVui lòng thử lại!');
            });
    }

    function formatPrice(price) {
        return new Intl.NumberFormat('vi-VN').format(price);
    }

    loadCart();
</script>
</body>
</html>
