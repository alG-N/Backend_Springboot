<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name}">Chi tiết sản phẩm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }

        .navbar {
            background: #333;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a { color: white; text-decoration: none; margin: 0 1rem; }
        .navbar a:hover { color: #ddd; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

        .product-detail {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .product-image {
            width: 100%;
            height: 400px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border-radius: 8px;
        }

        .product-info h1 { margin-bottom: 1rem; }
        .product-price {
            color: #e53935;
            font-size: 2rem;
            font-weight: bold;
            margin: 1rem 0;
        }
        .product-description {
            margin: 1rem 0;
            line-height: 1.6;
            color: #666;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        .quantity-selector input {
            width: 80px;
            padding: 0.5rem;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background: #388e3c; }
        .btn-back { background: #2196f3; margin-right: 1rem; }
        .btn-back:hover { background: #1976d2; }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<div class="navbar">
    <div>
        <a href="/" style="font-size: 1.5rem; font-weight: bold;">SHOP</a>
        <a href="/products">Sản phẩm</a>
    </div>
    <div>
            <span sec:authorize="isAuthenticated()">
                Xin chào, <span sec:authentication="name"></span>
                <a href="/orders">Đơn hàng</a>
                <a href="/logout">Đăng xuất</a>
            </span>
        <span sec:authorize="!isAuthenticated()">
                <a href="/login">Đăng nhập</a>
            </span>
        <a href="/cart" style="background: #4caf50; padding: 0.5rem 1rem; border-radius: 4px;">Giỏ hàng</a>
    </div>
</div>

<!-- Content -->
<div class="container">
    <div id="successMessage" class="success-message">Đã thêm vào giỏ hàng!</div>

    <div class="product-detail">
        <div>
            <div class="product-image">
                <span>No Image</span>
            </div>
        </div>

        <div class="product-info">
            <h1 th:text="${product.name}">Tên sản phẩm</h1>
            <div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0đ</div>
            <div class="product-description" th:text="${product.description}">Mô tả sản phẩm</div>

            <div class="quantity-selector">
                <label>Số lượng:</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>

            <div>
                <a href="/products" class="btn btn-back">← Quay lại</a>
                <button class="btn" onclick="addToCart()">Thêm vào giỏ hàng</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const product = {
        productId: [[${product.id}]],
        productName: [[${product.name}]],
        price: [[${product.price}]],
        image: [[${product.image}]]
    };

    function addToCart() {
        const quantity = parseInt(document.getElementById('quantity').value);

        const cartItem = {
            productId: product.productId,
            productName: product.productName,
            price: product.price,
            quantity: quantity,
            image: product.image
        };

        fetch('/api/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cartItem)
        })
            .then(response => response.text())
            .then(() => {
                const message = document.getElementById('successMessage');
                message.style.display = 'block';
                setTimeout(() => { message.style.display = 'none'; }, 3000);
            });
    }
</script>
</body>
</html>
